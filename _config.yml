# Import the theme
theme: jekyll-theme-chirpy

# Site language
lang: id-ID

# Timezone
timezone: Asia/Jakarta

# Site title
title: Dani Gunawan

# Subtitle
tagline: "sedikit-sedikit berbagi menjadi bukit"

# SEO description
description: >-
  Blog catatan untuk berbagi pengalaman seputar teknologi, DevOps, AI, dan programming.

# Site URL
url: "https://danigunawan.github.io"

github:
  username: danigunawan

social:
  name: Dani Gunawan
  email: danigunawan.elektroug@gmail.com
  links:
    - https://github.com/danigunawan
    - https://scholar.google.com/citations?user=c3FE9bkAAAAJ&hl=en
    - https://linktr.ee/danigunawan

# Theme mode: dark
theme_mode: dark

# Avatar on sidebar
avatar: "/images/avatar.jpg"

# Default preview image for posts without their own image
social_preview_image: "/images/posts/default.png"

# Table of Contents in posts
toc: true

# Comments
comments:
  provider: disqus
  disqus:
    shortname: danigunawan-github-io

# PWA
pwa:
  enabled: true
  cache:
    enabled: true

# Pagination
paginate: 10

# Base URL
baseurl: ""

# Kramdown
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Collections (Chirpy tabs)
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Sass
sass:
  style: compressed

# Compress HTML
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Exclude
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Gruntfile.js
  - gulpfile.js
  - node_modules
  - "*.less"

# Archives
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# Future posts
future: true