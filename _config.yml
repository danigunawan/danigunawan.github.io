title:            Dani Gunawan
subtitle:         "sedikit-sedikit berbagi menjadi bukit"
description:      blog catatan untuk berbagi
url: "https://danigunawan.github.io"
remote_theme: mmistakes/minimal-mistakes

# Skin (dark modern look)
minimal_mistakes_skin: "dark"

# Site Author
author:
  name:           "Dani Gunawan"
  avatar:         "/images/avatar.jpg"
  bio:            "sedikit-sedikit berbagi menjadi bukit"
  email:          danigunawan.elektroug@gmail.com
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/danigunawan"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=c3FE9bkAAAAJ&hl=en"
    - label: "Portofolio"
      icon: "fas fa-fw fa-link"
      url: "https://linktr.ee/danigunawan"

# Reading
reading_time:     true
words_per_minute: 200

# Comments
comments:
  provider: "disqus"
  disqus:
    shortname: "danigunawan-github-io"

# Timezone
timezone: Asia/Jakarta
future: true

# Build settings
highlighter: rouge
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

# Plugins (GitHub Pages whitelisted only)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-remote-theme

# Pagination
paginate: 10
paginate_path: /page:num/

# Permalink
permalink: /:categories/:title/

# Defaults - apply layout automatically
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
      show_date: true
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

include:
  - _pages

exclude:
  - "*.less"
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - lib
  - log
  - node_modules
  - package.json
  - spec
  - tmp

excerpt_separator: <!--more-->